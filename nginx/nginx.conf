events { worker_connections 1024; }

http {
    upstream api_backend {
        # 'api' matches the service name in docker-compose.yml
        server api:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}