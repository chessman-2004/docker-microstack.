name: Docker CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Static Analysis: Lint the Dockerfile
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  # 2. Security Scan: Vulnerability Scanning with Trivy
  security-scan:
    name: Scan Image for Vulnerabilities
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image Locally for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: my-hardened-app:test

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-hardened-app:test'
          format: 'table'
          exit-code: '0' # Set to '1' in production to block builds on vulnerabilities
          severity: 'CRITICAL,HIGH'

  # 3. Multi-Architecture Build
  build-and-push:
    name: Multi-Arch Build (Buildx)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Multi-Arch Build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false # Set to true once you connect Docker Hub/GHCR credentials