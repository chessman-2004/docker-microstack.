apiVersion: v1
kind: ConfigMap
metadata:
  name: microstack-config
data:
  REDIS_HOST: "cache"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "microservices_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: microstack-secrets
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "<REPLACE_WITH_YOUR_PASSWORD>"
  DATABASE_URL: "postgresql://postgres:<REPLACE_WITH_YOUR_PASSWORD>@db:5432/microservices_db"
